<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <title>Small Cafe</title>
  <style>

    /* Fondo rosa claro en toda la página */
    body {
      margin: 0;
      background-color: #f2e4e9;
      font-family: Arial, sans-serif;
    }

    /* Navbar tal como la tienes, con fondo oscuro */
    
    nav.navbar {
    position: fixed;       /* Fija el navbar en la parte superior */
    top: 0;
    left: 0;
    right: 0;
    z-index: 1030;         /* Por encima de todo */
    background-color: rgb(70, 67, 67); /* Fondo transparente */
    margin: 0;
    padding: 0.5rem 1rem;  /* Ajusta el padding a tu gusto */
    }

    .navbar-nav .nav-link {
    color: white !important;
    font-weight: 500;
    font-family: Arial, sans-serif;
    text-decoration: none;
    transition: all 0.3s ease;
    position: relative;
    }

    .navbar-nav .nav-link:hover {
    color: #ddd !important;
    }

    .navbar-nav .nav-selected {
    transform: translateY(4px);
    font-weight: 700;
    }
    /* Contenedor de búsqueda */
    .search-container {
      display: flex;
      align-items: center;
      padding: 10px 20px;
      gap: 10px;
      background: white;
    }

    .search-container input[type="text"] {
      flex-grow: 1;
      padding: 8px 12px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }

    .search-container button {
      background-color: #40454f;
      color: white;
      border: none;
      padding: 8px 14px;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-weight: 600;
      border-radius: 3px;
      transition: background-color 0.3s ease;
    }

    .search-container button:hover {
      background-color: #2f3a49;
    }

    .search-container .search-icon {
      font-size: 20px;
      color: #40454f;
      cursor: pointer;
      user-select: none;
    }

    /* Títulos de secciones */
    h2 {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      font-size: 1.5rem;
      text-align: center;
      margin: 30px 0 10px 0;
      color: #000;
    }

    /* Contenedores de secciones */
    .section-container {
      background-color: #c6c9cd;
      min-height: 100px;
      margin: 0 20px 30px 20px;
      padding: 10px;
      display: flex;
      flex-direction: row;
      justify-content: space-around;
    }

    /* Imagen café pequeño */
    .small-cafe img {
      max-width: 250px;
      height: auto;
      display: block;
    }

    .small-cafe .label {
      font-size: 12px;
      color: #444;
      margin-bottom: 6px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    img {
        width: 300px;          /* ancho fijo para todas las imágenes */
        height: 200px;         /* alto fijo para todas las imágenes */
        object-fit: cover;     /* recorta/ajusta la imagen para llenar el espacio sin deformar */
        display: inline-block;
        margin: 5px;           /* espacio entre imágenes */
        border-radius: 6px;    /* opcional, bordes redondeados */
        }
        footer {
  background-color: #40454f;  /* fondo oscuro */
  color: white;               /* texto blanco */
  padding: 40px 20px;
  text-align: center;
  font-family: Arial, sans-serif;
}

footer h3 {
  margin-bottom: 20px;
  font-size: 1.5rem;
  font-weight: 700;
}

footer p {
  margin: 5px 0;
  font-size: 0.9rem;
}

footer .social-icons {
  margin-top: 15px;
}

footer .social-icons a {
  display: inline-block;
  margin: 0 10px;
  color: white;
  font-size: 20px;
  transition: color 0.3s ease;
  text-decoration: none;
}

footer .social-icons a:hover {
  color: #f2a365; /* cambio de color al pasar el mouse */
}
  </style>
</head>
